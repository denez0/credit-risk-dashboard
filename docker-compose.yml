services:
  credit-risk-dashboard:
    build: .
    container_name: credit-risk-dashboard
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ./app.py:/app/app.py  # For live code updates (development)
    restart: unless-stopped